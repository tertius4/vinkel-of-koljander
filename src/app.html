<!doctype html>
<html lang="af">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    %sveltekit.head%

    <!-- Default title and link preview. The app renders in the browser only, so WhatsApp and others always see these. -->
    <title>Vinkel of Koljander</title>
    <meta name="description" content="Cynel se versameling resepte – van ouma se konfyt tot aangepaste tydskrif-resepte." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vinkel of Koljander" />
    <meta property="og:title" content="Vinkel of Koljander" />
    <meta property="og:description" content="Cynel se versameling resepte – van ouma se konfyt tot aangepaste tydskrif-resepte." />
    <meta property="og:image" content="https://vinkel-of-koljander.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="af_ZA" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/vinkel-of-koljander-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#994422" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VoK" />
    <script>
      // Chrome sends this once, usually before the app has loaded, so it is kept here for setupInstallPrompt.
      addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        window.install_prompt_event = event;
      });
    </script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
